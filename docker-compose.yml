services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-trixie
    environment:
      POSTGRES_USER: noted
      POSTGRES_PASSWORD: noted
      POSTGRES_DB: noted
    ports:
      - "5433:5432"
    volumes:
      - noted_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noted -d noted"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noted_pgdata:
