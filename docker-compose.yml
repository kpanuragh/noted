# The whole application. `docker compose up` gives you a working noted at
# http://localhost:3000 with nothing else installed.
services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-trixie
    environment:
      POSTGRES_USER: noted
      POSTGRES_PASSWORD: noted
      POSTGRES_DB: noted
    ports:
      - "5433:5432"
    volumes:
      - noted_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noted -d noted"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        # `service_healthy`, not `service_started`: the server runs migrations
        # at startup, and Postgres accepting a TCP connection is not the same as
        # Postgres being ready to serve one.
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://noted:noted@postgres:5432/noted
      BIND_ADDR: 0.0.0.0:8787
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      # Plain HTTP on localhost, so the session cookie cannot carry `Secure` —
      # it would never be sent and the app would look permanently signed out.
      # REMOVE THIS behind TLS.
      NOTED_INSECURE_COOKIES: "1"
      # The three model roles, configured independently — they have genuinely
      # different shapes. Extraction runs once per chunk across the whole
      # corpus (throughput-bound, mechanical, and where a per-token bill
      # actually accumulates); answering runs once per question with a human
      # waiting (latency-bound, and the one role where reasoning is the
      # product). Each takes `stub`, `ollama:<model>` or `gemini:<model>`.
      #
      # `stub` is the honest default, not a placeholder: the pipeline runs out
      # of the box and the graph it builds is DETERMINISTIC AND MEANINGLESS.
      # A misconfigured spec is fatal at startup rather than falling back here,
      # because a deployment quietly serving stub prose looks healthy.
      NOTED_EXTRACT: stub
      # NOTED_ANSWER: gemini:gemini-3.5-flash
      # NOTED_SUMMARY: gemini:gemini-3.5-flash
      #
      # For extraction prefer a NON-reasoning model: reading names out of a
      # sentence is mechanical, and on a corpus-wide job the thinking tokens
      # bill as output for no gain. Measured on one trivial extraction:
      # gemini-3.6-flash spent 1010 thinking tokens, gemini-3.5-flash-lite
      # spent 0, and the two answers were equivalent.
      # NOTED_EXTRACT: gemini:gemini-3.5-flash-lite
      #
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # NOTED_OLLAMA_URL: http://host.docker.internal:11434
      RUST_LOG: info
    ports:
      - "8787:8787"
    volumes:
      # The ONNX embedding model, ~400MB. On a named volume so it is downloaded
      # once rather than on every image rebuild.
      - noted_models:/home/noted/.fastembed_cache

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at BUILD time, so this has to be a build
        # arg — setting it only at runtime would leave the browser bundle
        # pointing at whatever the default was.
        NEXT_PUBLIC_API_BASE: http://localhost:8787
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8787
    ports:
      - "3000:3000"

volumes:
  noted_pgdata:
  noted_models:
