[package]
name = "noted-index"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
# Pulls in the ONNX runtime and the HuggingFace model downloader. Default-off so
# that `noted-server` — which only calls `materialize::rechunk_page` — does not
# link an inference stack it never uses. The `noted-index` binary requires it.
embed = ["dep:fastembed"]
# Pulls in an HTTP client for `extract_providers::OllamaExtractor`, a real
# (LLM-backed) `ExtractionProvider` that talks to a local Ollama server.
# Default-off for the same reason `embed` is: not every consumer wants the
# dependency, and there is no Ollama server in every environment (there is
# none in CI/dev here) to talk to.
extract-ollama = ["dep:reqwest", "dep:serde_json"]
# The Gemini-backed providers for all three roles. Same dependency set as
# `extract-ollama` but a separate flag on purpose: a deployment that runs a
# local model should not have to compile in a hosted-API client to say so, and
# vice versa. Both may be enabled together — an operator can reasonably want
# cheap local extraction and a hosted answerer.
gemini = ["dep:reqwest", "dep:serde_json"]

[dependencies]
sha2 = "0.10"
noted-db = { path = "../noted-db" }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx.workspace = true
anyhow.workspace = true
tracing-subscriber = "0.3"
fastembed = { version = "5.17", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
# UNCONDITIONAL, not gated behind `extract-ollama` as it once was: M2c's
# `graph_search::{LocalAnswer, Citation, Inclusion}` are response types that
# cross to HTTP and so must derive `Serialize` in every build, exactly as
# `noted_db::graph_search::GraphHit` already does. No new dependency — serde is
# already non-optional in `noted-db`, which this crate depends on unconditionally.
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# Unconditional (not gated behind `embed`): `extract.rs`'s `ExtractionProvider`
# trait is pure logic with no db/network dependency, so it — and this macro —
# must compile under a plain `cargo test`, not just with `--features embed`.
async-trait = "0.1"

[[bin]]
name = "noted-index"
path = "src/bin/noted-index.rs"
required-features = ["embed"]

[dev-dependencies]
# Calibration test only: measures real cosine distances to pick a cutoff.
pgvector = { version = "0.4.2", features = ["sqlx"] }
uuid.workspace = true
async-trait = "0.1"
# Self dev-dependency so this crate's own integration tests (which exercise the
# worker and the providers) compile with `embed` on under a plain `cargo test`.
# Without it the gated modules would vanish and those tests would silently stop
# testing anything.
noted-index = { path = ".", features = ["embed"] }
