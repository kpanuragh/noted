[package]
name = "noted-index"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
# Pulls in the ONNX runtime and the HuggingFace model downloader. Default-off so
# that `noted-server` — which only calls `materialize::rechunk_page` — does not
# link an inference stack it never uses. The `noted-index` binary requires it.
embed = ["dep:fastembed"]
# Pulls in an HTTP client for `extract_providers::OllamaExtractor`, a real
# (LLM-backed) `ExtractionProvider` that talks to a local Ollama server.
# Default-off for the same reason `embed` is: not every consumer wants the
# dependency, and there is no Ollama server in every environment (there is
# none in CI/dev here) to talk to.
extract-ollama = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
sha2 = "0.10"
noted-db = { path = "../noted-db" }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx.workspace = true
anyhow.workspace = true
tracing-subscriber = "0.3"
fastembed = { version = "5.17", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Unconditional (not gated behind `embed`): `extract.rs`'s `ExtractionProvider`
# trait is pure logic with no db/network dependency, so it — and this macro —
# must compile under a plain `cargo test`, not just with `--features embed`.
async-trait = "0.1"

[[bin]]
name = "noted-index"
path = "src/bin/noted-index.rs"
required-features = ["embed"]

[dev-dependencies]
uuid.workspace = true
async-trait = "0.1"
# Self dev-dependency so this crate's own integration tests (which exercise the
# worker and the providers) compile with `embed` on under a plain `cargo test`.
# Without it the gated modules would vanish and those tests would silently stop
# testing anything.
noted-index = { path = ".", features = ["embed"] }
