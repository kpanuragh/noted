[package]
name = "noted-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "noted_server"
path = "src/lib.rs"

[[bin]]
name = "noted-server"
path = "src/main.rs"

[dependencies]
noted-db = { path = "../noted-db" }
noted-crdt = { path = "../noted-crdt" }
# `embed` is back: hybrid search (GET /api/search) must embed the user's query
# at request time, so the ONNX runtime and model downloader are once again
# linked into the web server. This reverses the M1b decision that made the
# server default-features = false — that decision was correct when the server
# only called `rechunk_page`, but hybrid search cannot exist without it. The
# feature flag itself stays: `noted-index` remains slim by default so a
# search-free deployment (or the `noted-index` worker's own dev-deps) can opt
# out.
noted-index = { path = "../noted-index", features = ["embed"] }
axum = { version = "0.8", features = ["ws"] }
tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
anyhow.workspace = true
thiserror.workspace = true
futures-util = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
